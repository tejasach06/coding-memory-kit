# Add under mcp_servers in ~/.hermes/config.yaml, or use the Hermes MCP setup command.
# Export CODING_MEMORY_MCP_API_KEY from a secret manager or ~/.hermes/.env first.
coding-memory:
  url: http://192.168.0.9:8000/mcp/
  headers:
    X-API-Key: ${CODING_MEMORY_MCP_API_KEY}
  timeout: 180
  connect_timeout: 60
